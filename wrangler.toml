name = "mundial-2026-predictor"
main = "dist/index.js"
compatibility_date = "2025-01-01"
account_id = ""  # Tu Cloudflare account ID
workers_dev = true

# Pages Functions configuration
pages_build_caching = true

# Bindings
[[d1_databases]]
binding = "DB"
database_name = "mundial"
database_id = ""  # Se genera después de crear la BD en Cloudflare

# Environment variables (use 'wrangler secret' for sensitive values)
[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }

# Cron jobs (opcional para refresh automático)
[[triggers.crons]]
crons = ["0 */6 * * *"]  # Cada 6 horas
